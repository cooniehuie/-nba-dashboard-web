name: Parlay Lab checks
on:
  push:
    paths:
      - 'app.py'
      - 'parlay_lab.py'
      - 'tests/test_parlay_lab.py'
      - '.github/workflows/parlay-lab-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m py_compile app.py parlay_lab.py
      - name: Run parlay builder tests
        run: python -m unittest discover -s tests -p 'test_parlay_lab.py' -v
