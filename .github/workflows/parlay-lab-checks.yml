name: Parlay Lab checks
on:
  push:
    paths:
      - 'app.py'
      - 'parlay_*.py'
      - 'huie_individual_games.py'
      - 'tests/test_*.py'
      - 'requirements.txt'
      - '.github/workflows/parlay-lab-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile dashboard and every model module
        run: python -m py_compile app.py parlay_*.py huie_individual_games.py
      - name: Run all parlay regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
