name: Archive daily NBA safe-line results
on:
  schedule:
    - cron: '17 15,19,23 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: safe-line-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas openpyxl
      - run: python archive_safe_lines.py
        env:
          GITHUB_STORAGE_TOKEN: ${{ secrets.GITHUB_STORAGE_TOKEN }}
          GITHUB_STORAGE_REPO: ${{ secrets.GITHUB_STORAGE_REPO || vars.GITHUB_STORAGE_REPO }}
