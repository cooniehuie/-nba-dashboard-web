name: Sam's Models HTML collector (validation only)
on:
  schedule:
    # Hourly UTC candidates; script gates to 08:00–15:00 America/Los_Angeles.
    - cron: '0 15-23 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sam-models-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SAM_MODELS_STORAGE_STATE_B64: ${{ secrets.SAM_MODELS_STORAGE_STATE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser tooling
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4
          python -m playwright install --with-deps chromium
      - name: Collect and validate (no website publication)
        run: python scripts/collect_sam_models.py
      - name: Upload validated HTML only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sam-models-html-${{ github.run_id }}
          path: sam_models_output/
          retention-days: 7
          if-no-files-found: error
